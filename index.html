 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin Franklin</title>
    <style>
        header{
            background-color:#20065b;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;  
            padding: 18px;
            border: 3px solid #0e5b9e;
        }
        main{
          background-color:#FFFFFF;
            color: #20065b;  
            text-align: center;
            max-width: 800px;
            margin: 0 auto;  
        }
        img{
            display: block;      
            margin: 0 auto;    
            width: 60%;        
            height: auto;    
           }
        
    </style>
</head>
<body>
    <header>
        <h1>John-Dalton</h1>
    <p> Químico, fisíco e meteorologista britânico</p>
    </header>

    <main>
        <img src="imagem-blog.png" alt="Retrato em pintura de John Dalton, um homem mais velho com óculos 
          redondos, cabelos grisalhos e expressão séria, vestindo roupas escuras do século XIX.">
        <h2>Saiba mais sobre a vida e feitos de John-Dalton</h2>
        <p> Por Ana Beatriz</p>
        <button>❤<span>0</span></button>
        <button>👍<span>0</span></button>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");
    
    botoes.forEach(function(botao){
        botao.addEventListener("click", botaoClicado);
        function botaoClicado(){
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        } 

    })



</script>
</html>
